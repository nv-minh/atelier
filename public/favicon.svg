<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Atelier">
  <!-- The Atelier mark: a single-storey lowercase "a" — the bowl as a stroked
       ring, the stem as a rounded bar fused to its right side. Geometry is
       mirrored in src/lib/brand.ts (MARK), which drives the PNG icons.

       Drawn as geometry rather than a <text> element on purpose: the old mark
       set font-family="Georgia", which does not exist on Android or most Linux
       desktops, so the logo silently rendered in a different typeface per
       platform. Pure vector renders identically everywhere and stays legible
       when the browser paints it at 16px. -->
  <rect width="64" height="64" rx="14" fill="#1F1C16"/>
  <circle cx="29.5" cy="32" r="11.5" fill="none" stroke="#E2942A" stroke-width="9"/>
  <rect x="41.5" y="16" width="9" height="32" rx="4.5" fill="#E2942A"/>
</svg>
